<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>final_merged_hyperframes</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #f7f3ee;
        overflow: hidden;
      }

      @font-face {
        font-family: "Noto Sans Thai";
        src: local("Noto Sans Thai");
      }

      @font-face {
        font-family: "Thonburi";
        src: local("Thonburi");
      }

      #assembled-video-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #15110d;
        font-family: "Avenir Next", Arial, sans-serif;
      }

      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #15110d;
        z-index: 1;
      }

      .transition-wash {
        position: absolute;
        inset: 0;
        z-index: 15;
        background: rgba(216, 181, 109, 0.26);
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="assembled-video-root" data-composition-id="assembled-video" data-start="0" data-width="1080" data-height="1920" data-duration="17.0">
      <video id="video-1" data-start="0.0" data-duration="10.0" data-track-index="0" src="media/segment_01.mp4" muted playsinline></video>
      <audio id="audio-1" data-start="0.0" data-duration="10.0" data-track-index="1" src="media/segment_01.mp4" data-volume="1"></audio>
      <video id="video-2" data-start="10.0" data-duration="7.0" data-track-index="0" src="media/segment_02.mp4" muted playsinline></video>
      <audio id="audio-2" data-start="10.0" data-duration="7.0" data-track-index="1" src="media/segment_02.mp4" data-volume="1"></audio>
      <div id="transition-1" class="clip transition-wash" data-start="9.820" data-duration="0.36" data-track-index="8"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#transition-1", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "sine.inOut" }, 9.820);
      tl.to("#transition-1", { opacity: 0, duration: 0.18, ease: "sine.inOut" }, 9.960);
      window.__timelines["assembled-video"] = tl;
    </script>
  </body>
</html>
