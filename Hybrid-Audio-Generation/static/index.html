<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>配音智能体</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/opc-theme.css?v=20260828-contrast1">
</head>
<body class="opc-agent">
  <header>
    <div>
      <div class="eyebrow">PORT 10004 · LOCAL VOICE GENERATION</div>
      <h1>配音智能体</h1>
      <p>读取本地音频文案，通过 HyperFrames 本地 TTS 生成 1.2 倍自然语速的 M4A，供 AI＋实拍混剪直接扫描。</p>
    </div>
    <div class="opc-header-actions">
      <button id="refreshButton">重新扫描文案</button>
      <a class="opc-home-link" href="http://127.0.0.1:8888/">返回控制台</a>
    </div>
  </header>
  <main>
    <section class="panel controls">
      <div class="panelTitle"><span>01</span> 选择配音文案</div>
      <label>产品与文案文件
        <select id="documentSelect"></select>
      </label>
      <label>国家
        <select id="marketSelect"></select>
      </label>
      <label>声音
        <select id="voiceSelect"></select>
      </label>
      <div class="fixedSetting">
        <span>生成语速</span>
        <strong>1.2 倍自然语速</strong>
      </div>
      <label class="checkbox">
        <input id="overwriteInput" type="checkbox">
        覆盖已经生成的同名音频
      </label>
      <button class="primary" id="generateButton" disabled>生成所选音频</button>
      <div class="pathNote" id="pathNote"></div>
    </section>

    <section class="panel library">
      <div class="panelTitle row">
        <div><span>02</span> 音频文案</div>
        <div class="actions">
          <button id="selectAllButton">全选未生成</button>
          <button id="clearButton">清除</button>
        </div>
      </div>
      <div id="summary" class="summary"></div>
      <div id="entries" class="entries"></div>
    </section>

    <section class="panel statusPanel">
      <div class="panelTitle"><span>03</span> 任务状态</div>
      <div id="taskMessage" class="taskMessage">空闲</div>
      <div id="progress" class="progress"><div></div></div>
      <pre id="logs">暂无运行日志</pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
