<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>视频拆解智能体</title>
    <link rel="stylesheet" href="/app.css?v=agent-contrast-audit-20260903" />
    <link rel="stylesheet" href="/opc-theme.css?v=20260828-contrast1" />
  </head>
  <body class="opc-agent">
    <header class="topbar">
      <div>
        <h1>视频拆解智能体</h1>
        <p id="rootPath"></p>
      </div>
      <div class="status-strip">
        <span id="modelBadge">Model</span>
        <span id="keyBadge">API</span>
        <a class="opc-home-link" href="http://127.0.0.1:8888/">返回控制台</a>
      </div>
    </header>

    <main class="shell">
      <section class="panel collection-panel">
        <div class="panel-head">
          <h2>视频采集</h2>
        </div>

        <div class="panel-body">
          <div id="urlDownloadBlock" class="url-download-block">
            <div class="stage-note">粘贴 TikTok 视频链接，下载到对应内容线路和产品目录。</div>
            <div class="field-block">
              <label for="contentLineInput">内容线路</label>
              <select id="contentLineInput">
                <option value="pure_ai">纯 AI 视频</option>
                <option value="hybrid">AI＋实拍混剪</option>
              </select>
            </div>
            <div id="materialTypeBlock" class="field-block" hidden>
              <label for="materialTypeInput">混剪参考类型</label>
              <select id="materialTypeInput">
                <option value="混剪-钩子">混剪钩子</option>
                <option value="混剪-CTA">混剪 CTA</option>
              </select>
            </div>
            <div class="field-block">
              <label for="downloadProductInput">保存到产品目录</label>
              <select id="downloadProductInput">
                <option value="">正在读取产品目录...</option>
              </select>
            </div>
            <div class="field-block">
              <label for="directUrlsInput">TikTok 视频 URL</label>
              <textarea id="directUrlsInput" placeholder="每行一个标准 TikTok 视频链接"></textarea>
            </div>
            <button id="downloadUrlsBtn" class="primary wide">开始下载</button>
            <div class="process-note">仅下载视频；完成后自动刷新待拆解队列，不会自动调用模型。</div>
          </div>
        </div>
      </section>

      <section class="panel queue-panel">
        <div class="panel-head">
          <h2>扫描拆解视频</h2>
          <button id="openConfigBtn" class="secondary">编辑提示词</button>
        </div>

        <div class="panel-body">

          <div class="field-block">
            <label for="batchLimitInput">本次拆解条数</label>
            <input id="batchLimitInput" type="number" min="1" step="1" placeholder="留空处理全部待拆解视频" />
          </div>
          <div class="process-note">逐条处理，非并发；填 1 即本次只处理 1 条。</div>

          <div class="split-actions">
            <button id="scanBtn" class="secondary">扫描视频</button>
            <button id="processBtn" class="primary">开始拆解</button>
          </div>

          <div class="queue-summary" id="queueSummary" hidden></div>

          <div class="subhead row-head">
            <span>待拆解</span>
            <span id="selectedCount" class="muted">已选 0</span>
          </div>
          <div id="selectionTools" class="selection-tools" hidden>
            <button id="selectAllBtn" class="secondary">全选</button>
            <button id="clearSelectionBtn" class="secondary">清空</button>
          </div>
          <div id="pendingList" class="list queue-list"></div>

          <details class="skip-block">
            <summary>重复跳过</summary>
            <div id="skippedList" class="list"></div>
          </details>

          <details class="skip-block">
            <summary>无法识别 ID</summary>
            <div id="missingIdList" class="list"></div>
          </details>
        </div>
      </section>

      <section class="panel run-panel">
        <div class="panel-head">
          <h2>拆解运行</h2>
          <span id="jobStatus" class="badge idle">待机</span>
        </div>
        <div class="panel-body">
          <div id="progressPanel" class="progress-panel" hidden></div>
          <pre id="logPane" class="log-pane">等待任务...</pre>

          <details class="settings-block">
            <summary>模型配置</summary>
            <div class="settings-content">
              <div class="settings-grid">
                <label>模型<input id="modelInput" type="text" /></label>
                <label>Base URL<input id="baseUrlInput" type="text" /></label>
                <label>API Key<input id="apiKeyInput" type="password" placeholder="留空则不修改" /></label>
              </div>
              <button id="saveSettingsBtn" class="secondary wide">保存配置</button>
            </div>
          </details>
        </div>
      </section>

      <section class="panel result-panel">
        <div class="panel-head">
          <h2>脚本结果</h2>
          <button id="openOutputBtn" class="secondary">打开目录</button>
        </div>
        <div class="panel-body">
          <div id="outputList" class="runs"></div>
        </div>
      </section>
    </main>

    <div id="editorModal" class="editor-modal" hidden>
      <section class="config-drawer">
        <div class="tabbar">
          <button class="tab active" data-config="prompt">提示词</button>
          <button id="saveConfigBtn" class="secondary">保存文件</button>
          <button id="closeConfigBtn" class="secondary">关闭</button>
        </div>
        <textarea id="configEditor" spellcheck="false"></textarea>
      </section>
    </div>

    <script src="/app.js?v=four-stage-20260827"></script>
  </body>
</html>
