name: opc-agent-suite

x-common-environment: &common-environment
  HOME: /config
  PYTHONPATH: /workspace
  OPC_ENV_FILE: /config/.env
  KESAI_APP_HOST: 0.0.0.0
  KESAI_APP_NO_OPEN: "1"
  BITBROWSER_API_URL: ${BITBROWSER_API_URL:-http://host.docker.internal:54345}
  OPC_VAULT_ROOT: /vault
  VIDEO_TEARDOWN_INPUT_ROOT: /vault/wiki/视频/纯AI视频/01来源素材
  VIDEO_TEARDOWN_OUTPUT_ROOT: /vault/wiki/视频/纯AI视频/02参考脚本
  PRODUCT_SCRIPT_ROOT: /vault/wiki/视频/纯AI视频/03产品脚本
  SCRIPT_ROOT: /vault/wiki/视频/纯AI视频/04适配脚本/omni
  GROK_SCRIPT_ROOT: /vault/wiki/视频/纯AI视频/04适配脚本/grok
  REFERENCE_ROOT: /vault/wiki/产品/产品底图
  VIDEO_OUTPUT_ROOT: /vault/wiki/视频/纯AI视频/05AI片段/omni
  GROK_VIDEO_OUTPUT_ROOT: /vault/wiki/视频/纯AI视频/05AI片段/grok
  VIDEO_ASSEMBLY_PENDING_ROOT: /vault/wiki/视频/纯AI视频/06合成工作区
  VIDEO_ASSEMBLY_OUTPUT_ROOT: /vault/wiki/视频/成品视频
  VIDEO_TITLE_LIBRARY_ROOT: /vault/wiki/视频/成品视频/视频标题库
  SCRIPT_MISTAKE_BOOK_ROOT: /vault/wiki/视频/共享知识库/脚本错题本
  HYBRID_VIDEO_TEARDOWN_INPUT_ROOT: /vault/wiki/视频/AI实拍混剪/01参考视频
  HYBRID_VIDEO_TEARDOWN_OUTPUT_ROOT: /vault/wiki/视频/AI实拍混剪/02解析脚本
  HYBRID_SCRIPT_GENERATION_INPUT_ROOT: /vault/wiki/视频/AI实拍混剪/02解析脚本
  HYBRID_SCRIPT_GENERATION_OUTPUT_ROOT: /vault/wiki/视频/AI实拍混剪/03复刻裂变脚本
  HYBRID_OMNI_SCRIPT_ROOT: /vault/wiki/视频/AI实拍混剪/04适配脚本/omni
  HYBRID_AI_CLIP_ROOT: /vault/wiki/视频/AI实拍混剪/05AI片段
  HYBRID_OMNI_VIDEO_OUTPUT_ROOT: /vault/wiki/视频/AI实拍混剪/05AI片段/omni
  HYBRID_AUDIO_COPY_ROOT: /vault/wiki/视频/AI实拍混剪/06音频文案
  HYBRID_PRODUCT_AUDIO_ROOT: /vault/wiki/视频/AI实拍混剪/06音频文件
  HYBRID_REAL_FOOTAGE_ROOT: /vault/wiki/视频/AI实拍混剪/07实拍素材
  HYBRID_MIX_WORK_ROOT: /vault/wiki/视频/AI实拍混剪/08混剪工作区
  OPC_HOT_VIDEO_AGENT_URL: http://video-collection:9991/
  OPC_VIDEO_TEARDOWN_AGENT_URL: http://script-analysis:9992/
  OPC_SCRIPT_PRODUCTION_AGENT_URL: http://script-generation:9993/
  OPC_SCRIPT_ADAPTATION_AGENT_URL: http://script-adaptation:9994/
  OPC_VIDEO_OUTPUT_AGENT_URL: http://video-generation:9995/
  OPC_FINISHED_VIDEO_MANAGER_URL: http://finished-video-manager:9996/
  OPC_PRODUCT_SCRIPT_REWRITE_URL: http://product-script-rewrite:9997/
  OPC_VIDEO_ASSEMBLY_AGENT_URL: http://video-assembly:9998/
  OPC_HYBRID_SCRIPT_ADAPTATION_AGENT_URL: http://hybrid-script-adaptation:9999/
  OPC_HYBRID_VIDEO_MIXER_AGENT_URL: http://hybrid-video-mixer:10000/
  OPC_HYBRID_VIDEO_COLLECTION_AGENT_URL: http://hybrid-video-collection:10001/
  OPC_HYBRID_SCRIPT_ANALYSIS_AGENT_URL: http://hybrid-script-analysis:10002/
  OPC_HYBRID_SCRIPT_GENERATION_AGENT_URL: http://hybrid-script-generation:10003/
  OPC_HYBRID_AUDIO_GENERATION_AGENT_URL: http://hybrid-audio-generation:10004/
  OPC_AUTO_PUBLISH_PIPELINE_URL: http://auto-publish-pipeline:10005/
  OPC_UPDATER_URL: http://opc-updater:18888
  OPC_HOT_VIDEO_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:9991/
  OPC_VIDEO_TEARDOWN_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:9992/
  OPC_SCRIPT_PRODUCTION_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:9993/
  OPC_SCRIPT_ADAPTATION_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:9994/
  OPC_VIDEO_OUTPUT_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:9995/
  OPC_FINISHED_VIDEO_MANAGER_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:9996/
  OPC_PRODUCT_SCRIPT_REWRITE_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:9997/
  OPC_VIDEO_ASSEMBLY_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:9998/
  OPC_HYBRID_SCRIPT_ADAPTATION_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:9999/
  OPC_HYBRID_VIDEO_MIXER_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:10000/
  OPC_HYBRID_VIDEO_COLLECTION_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:10001/
  OPC_HYBRID_SCRIPT_ANALYSIS_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:10002/
  OPC_HYBRID_SCRIPT_GENERATION_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:10003/
  OPC_HYBRID_AUDIO_GENERATION_AGENT_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:10004/
  OPC_AUTO_PUBLISH_PIPELINE_URL_PUBLIC: http://${OPC_PUBLIC_HOST:-localhost}:10005/

x-common-service: &common-service
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file: .env
  environment: *common-environment
  volumes: &common-volumes
    - "${OPC_VAULT_ROOT:?Set OPC_VAULT_ROOT in .env}:/vault"
    - "${OPC_DOCKER_DATA_ROOT:?Set OPC_DOCKER_DATA_ROOT in .env}/config:/config"
  healthcheck: &common-healthcheck
    interval: 30s
    timeout: 5s
    start_period: 15s
    retries: 3
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVICE_PORT}$${HEALTH_PATH} >/dev/null"]

services:
  opc-updater:
    build:
      context: ./OPC-Updater
    restart: unless-stopped
    working_dir: /repo
    environment:
      OPC_UPDATER_HOST: 0.0.0.0
      OPC_UPDATER_PORT: "18888"
      OPC_REPO_ROOT: /repo
      OPC_CONFIG_ROOT: /config
      OPC_COMPOSE_PROJECT: opc-agent-suite
      OPC_UPDATE_BRANCH: main
    volumes:
      - .:/repo
      - "${OPC_DOCKER_DATA_ROOT:?Set OPC_DOCKER_DATA_ROOT in .env}/config:/config"
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18888/health', timeout=3)"]

  console:
    <<: *common-service
    build:
      context: .
      args:
        SERVICE_DIR: OPC-Console
    working_dir: /workspace/OPC-Console
    command: ["python", "-u", "kesai_app.py"]
    environment:
      <<: *common-environment
      KESAI_APP_PORT: "8888"
      OPC_ENV_FILE: /config/.env
      SERVICE_PORT: "8888"
      HEALTH_PATH: /health
    ports:
      - "${OPC_DOCKER_BIND:-127.0.0.1}:8888:8888"
    depends_on:
      - opc-updater
      - video-collection
      - script-analysis
      - script-generation
      - script-adaptation
      - video-generation
      - finished-video-manager
      - product-script-rewrite
      - video-assembly
      - hybrid-script-adaptation
      - hybrid-video-mixer
      - hybrid-video-collection
      - hybrid-script-analysis
      - hybrid-script-generation
      - hybrid-audio-generation
      - auto-publish-pipeline

  video-collection:
    <<: *common-service
    build:
      context: .
      args: {SERVICE_DIR: Video-Collection, INSTALL_PLAYWRIGHT: "1", SYSTEM_PACKAGES: "xvfb x11vnc novnc websockify fluxbox"}
    working_dir: /workspace/Video-Collection
    command: ["/workspace/scripts/start_visible_browser.sh", "python", "-u", "-m", "hot_video_agent", "web", "--host", "0.0.0.0", "--port", "9991"]
    environment: {<<: *common-environment, SERVICE_PORT: "9991", HEALTH_PATH: /health, OPC_BROWSER_VIEWER_PORT: "15991"}
    ports:
      - "${OPC_DOCKER_BIND:-127.0.0.1}:9991:9991"
      - "${OPC_DOCKER_BIND:-127.0.0.1}:15991:6080"

  script-analysis:
    <<: *common-service
    build: {context: ., args: {SERVICE_DIR: Script-Analysis}}
    working_dir: /workspace/Script-Analysis
    command: ["python", "-u", "scripts/web_app.py", "--host", "0.0.0.0", "--port", "9992"]
    environment: {<<: *common-environment, SERVICE_PORT: "9992", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:9992:9992"]

  script-generation:
    <<: *common-service
    build: {context: ., args: {SERVICE_DIR: Script-Generation}}
    working_dir: /workspace/Script-Generation
    command: ["python", "-u", "-m", "opc_engine.features.script_generation.script_generation_agent_web", "--host", "0.0.0.0", "--port", "9993"]
    environment: {<<: *common-environment, SERVICE_PORT: "9993", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:9993:9993"]

  script-adaptation:
    <<: *common-service
    build: {context: ., args: {SERVICE_DIR: Script-Adaptation}}
    working_dir: /workspace/Script-Adaptation/software/Script-Adaptation-app
    command: ["python", "-u", "-m", "opc_engine.features.script_adaptation.script_adaptation_agent_web", "--host", "0.0.0.0", "--port", "9994"]
    environment: {<<: *common-environment, SERVICE_PORT: "9994", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:9994:9994"]

  video-generation:
    <<: *common-service
    build: {context: ., args: {SERVICE_DIR: Video-Generation}}
    working_dir: /workspace/Video-Generation
    command: ["python", "-u", "-m", "uvicorn", "agent.app:app", "--host", "0.0.0.0", "--port", "9995"]
    environment: {<<: *common-environment, SERVICE_PORT: "9995", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:9995:9995"]

  finished-video-manager:
    <<: *common-service
    build:
      context: .
      args: {SERVICE_DIR: Finished-Video-Manager, INSTALL_PLAYWRIGHT: "1", SYSTEM_PACKAGES: ffmpeg}
    working_dir: /workspace/Finished-Video-Manager
    command: ["python", "-u", "-m", "finished_video_manager.web", "web", "--host", "0.0.0.0", "--port", "9996"]
    environment: {<<: *common-environment, SERVICE_PORT: "9996", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:9996:9996"]
    volumes:
      - "${OPC_VAULT_ROOT:?Set OPC_VAULT_ROOT in .env}:/vault"
      - "${OPC_DOCKER_DATA_ROOT:?Set OPC_DOCKER_DATA_ROOT in .env}/config:/config"
      - "${OPC_DOCKER_DATA_ROOT:?Set OPC_DOCKER_DATA_ROOT in .env}/finished-video-data:/workspace/Finished-Video-Manager/data"
      - ./Finished-Video-Manager/config/product_mappings.json:/workspace/Finished-Video-Manager/config/product_mappings.json

  product-script-rewrite:
    <<: *common-service
    build: {context: ., args: {SERVICE_DIR: Product-Script-Rewrite}}
    working_dir: /workspace/Product-Script-Rewrite
    command: ["python", "-u", "-m", "product_script_rewrite.web", "--host", "0.0.0.0", "--port", "9997"]
    environment: {<<: *common-environment, SERVICE_PORT: "9997", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:9997:9997"]

  video-assembly:
    <<: *common-service
    shm_size: 512mb
    build:
      context: .
      target: hyperframes
      args:
        SERVICE_DIR: Video-Assembly-hd
        INSTALL_PLAYWRIGHT: "1"
        SYSTEM_PACKAGES: ffmpeg
    working_dir: /workspace/Video-Assembly-hd
    command: ["python", "-u", "app/server.py", "--host", "0.0.0.0", "--port", "9998"]
    environment: {<<: *common-environment, SERVICE_PORT: "9998", HEALTH_PATH: /health, VIDEO_ASSEMBLY_WORK_ROOT: /assembly-work}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:9998:9998"]
    volumes:
      - "${OPC_VAULT_ROOT:?Set OPC_VAULT_ROOT in .env}:/vault"
      - "${VIDEO_ASSEMBLY_WORK_ROOT:?Set VIDEO_ASSEMBLY_WORK_ROOT in .env}:/assembly-work"
      - "${OPC_DOCKER_DATA_ROOT:?Set OPC_DOCKER_DATA_ROOT in .env}/config:/config"
      - "${OPC_DOCKER_DATA_ROOT:?Set OPC_DOCKER_DATA_ROOT in .env}/video-assembly-data:/workspace/Video-Assembly-hd/data"

  hybrid-script-adaptation:
    <<: *common-service
    build: {context: ., args: {SERVICE_DIR: Hybrid-Script-Adaptation}}
    working_dir: /workspace/Hybrid-Script-Adaptation/software/Hybrid-Script-Adaptation-app
    command: ["python", "-u", "-m", "opc_engine.features.script_adaptation.script_adaptation_agent_web", "--host", "0.0.0.0", "--port", "9999"]
    environment: {<<: *common-environment, SERVICE_PORT: "9999", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:9999:9999"]

  hybrid-video-mixer:
    <<: *common-service
    build: {context: ., args: {SERVICE_DIR: Hybrid-Video-Mixer, SYSTEM_PACKAGES: ffmpeg}}
    working_dir: /workspace/Hybrid-Video-Mixer
    command: ["python", "-u", "app/server.py", "--host", "0.0.0.0", "--port", "10000"]
    environment: {<<: *common-environment, SERVICE_PORT: "10000", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:10000:10000"]

  hybrid-video-collection:
    <<: *common-service
    build:
      context: .
      args: {SERVICE_DIR: Hybrid-Video-Collection, INSTALL_PLAYWRIGHT: "1", SYSTEM_PACKAGES: "xvfb x11vnc novnc websockify fluxbox"}
    working_dir: /workspace/Hybrid-Video-Collection
    command: ["/workspace/scripts/start_visible_browser.sh", "python", "-u", "-m", "hot_video_agent", "web", "--host", "0.0.0.0", "--port", "10001"]
    environment: {<<: *common-environment, SERVICE_PORT: "10001", HEALTH_PATH: /health, OPC_BROWSER_VIEWER_PORT: "16001"}
    ports:
      - "${OPC_DOCKER_BIND:-127.0.0.1}:10001:10001"
      - "${OPC_DOCKER_BIND:-127.0.0.1}:16001:6080"

  hybrid-script-analysis:
    <<: *common-service
    build: {context: ., args: {SERVICE_DIR: Hybrid-Script-Analysis}}
    working_dir: /workspace/Hybrid-Script-Analysis
    command: ["python", "-u", "scripts/web_app.py", "--host", "0.0.0.0", "--port", "10002"]
    environment: {<<: *common-environment, SERVICE_PORT: "10002", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:10002:10002"]

  hybrid-script-generation:
    <<: *common-service
    build: {context: ., args: {SERVICE_DIR: Hybrid-Script-Generation}}
    working_dir: /workspace/Hybrid-Script-Generation
    command: ["python", "-u", "-m", "opc_engine.features.script_generation.script_generation_agent_web", "--host", "0.0.0.0", "--port", "10003"]
    environment: {<<: *common-environment, SERVICE_PORT: "10003", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:10003:10003"]

  hybrid-audio-generation:
    <<: *common-service
    build: {context: ., args: {SERVICE_DIR: Hybrid-Audio-Generation, SYSTEM_PACKAGES: "espeak-ng libsndfile1"}}
    working_dir: /workspace/Hybrid-Audio-Generation
    command: ["python", "-u", "-m", "audio_agent.web", "--host", "0.0.0.0", "--port", "10004"]
    environment: {<<: *common-environment, SERVICE_PORT: "10004", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:10004:10004"]

  auto-publish-pipeline:
    <<: *common-service
    shm_size: 512mb
    build:
      context: .
      target: hyperframes
      args:
        SERVICE_DIR: Auto-Publish-Pipeline
        EXTRA_REQUIREMENTS: "Script-Adaptation Video-Generation Finished-Video-Manager"
        INSTALL_PLAYWRIGHT: "1"
        SYSTEM_PACKAGES: ffmpeg
    working_dir: /workspace/Auto-Publish-Pipeline
    command: ["python", "-u", "-m", "auto_publish_pipeline.web", "--host", "0.0.0.0", "--port", "10005"]
    environment: {<<: *common-environment, SERVICE_PORT: "10005", HEALTH_PATH: /health}
    ports: ["${OPC_DOCKER_BIND:-127.0.0.1}:10005:10005"]
    volumes:
      - "${OPC_VAULT_ROOT:?Set OPC_VAULT_ROOT in .env}:/vault"
      - "${OPC_DOCKER_DATA_ROOT:?Set OPC_DOCKER_DATA_ROOT in .env}/config:/config"
      - "${OPC_DOCKER_DATA_ROOT:?Set OPC_DOCKER_DATA_ROOT in .env}/auto-publish-data:/workspace/Auto-Publish-Pipeline/data"
      - "${OPC_DOCKER_DATA_ROOT:?Set OPC_DOCKER_DATA_ROOT in .env}/finished-video-data:/workspace/Finished-Video-Manager/data"
      - "${OPC_DOCKER_DATA_ROOT:?Set OPC_DOCKER_DATA_ROOT in .env}/video-assembly-data:/workspace/Video-Assembly-hd/data"
      - ./Finished-Video-Manager/config/product_mappings.json:/workspace/Finished-Video-Manager/config/product_mappings.json
