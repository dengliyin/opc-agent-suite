<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>脚本创作与适配智能体</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <div>
      <h1>脚本创作与适配智能体</h1>
      <p>选择来源、创作方式和市场后，直接生成 9995 可读取的 Omni 适配稿，不保存中间脚本。</p>
    </div>
    <nav>
      <a href="http://localhost:8888/">返回 8888</a>
      <a href="http://localhost:9995/omni" target="_blank" rel="noreferrer">打开片段产出</a>
    </nav>
  </header>

  <main>
    <section class="statusbar">
      <span class="status ok">Omni 已开放</span>
      <span class="status pending">Grok 待审核</span>
      <span class="status pending">Veo 待审核</span>
      <span id="modelStatus">正在读取全局文本模型…</span>
      <button id="scanButton" type="button">扫描资料库</button>
    </section>

    <div class="layout">
      <form id="taskForm" class="workspace">
        <section class="panel">
          <div class="panelTitle"><b>1. 选择生产线路</b><span>决定业务输入、输出位置和产品资料规则</span></div>
          <div class="routeLayout">
            <div class="routeGrid">
              <label class="choice"><input type="radio" name="route" value="route1" checked><strong>线路 1 · 爆款复刻</strong></label>
              <label class="choice"><input type="radio" name="route" value="route2"><strong>线路 2 · 产品脚本改写</strong></label>
              <label class="choice"><input type="radio" name="route" value="route3"><strong>线路 3 · AI＋实拍混剪</strong></label>
            </div>
            <div class="pathBox" id="pathBox"></div>
          </div>
        </section>

        <section class="panel grid2">
          <div>
            <div class="panelTitle"><b>2. 选择来源脚本</b><span>首屏只读索引，不会自动全量扫描资料库</span></div>
            <label>来源产品<select id="sourceProduct"></select></label>
            <label>来源脚本<select id="sourceScript" required></select></label>
            <div class="sourceStatus" id="sourceStatus"></div>
            <div class="hint" id="sourceHint"></div>
          </div>
          <div>
            <div class="panelTitle"><b>3. 选择创作方式</b><span>裂变按每批最多 3 条执行，合格结果立即保存</span></div>
            <div class="modeRow">
              <label class="choice compact"><input type="radio" name="mode" value="clone" checked><strong>复刻</strong></label>
              <label class="choice compact"><input type="radio" name="mode" value="mutation"><strong>裂变</strong></label>
            </div>
            <label id="variantField">裂变数量<input id="variantCount" type="number" min="1" max="99" value="3"></label>
          </div>
        </section>

        <section class="panel grid2">
          <div>
            <div class="panelTitle"><b>4. 产品资料</b><span id="productRule">自动使用来源产品资料</span></div>
            <div class="autoProduct" id="autoProduct"><span>自动使用来源产品</span><strong id="autoTargetProduct">正在读取…</strong></div>
            <label id="targetProductField">目标产品<select id="targetProduct"></select></label>
          </div>
          <div>
            <div class="panelTitle"><b>5. 市场与模型</b><span>Omni 规则与输出格式已经封版</span></div>
            <div class="grid2 tight">
              <label>国家/地区<select id="targetMarket"></select></label>
              <label>目标语言<input id="targetLanguage" type="text" placeholder="按国家自动匹配，可手动修改"></label>
            </div>
            <label>视频模型<select id="targetModel"><option value="omni">Omni（已开放）</option><option disabled>Grok（待审核）</option><option disabled>Veo（待审核）</option></select></label>
          </div>
        </section>

        <section class="panel">
          <div class="submitRow">
            <span id="formMessage">请选择参数后创建任务。</span>
            <button class="primary" id="submitButton" type="submit">创建并执行任务</button>
          </div>
        </section>
      </form>

      <aside class="panel jobsPanel idle">
        <div class="panelTitle"><b>任务队列</b><span id="queueStatus">暂无任务</span></div>
        <div id="jobs" class="jobs"></div>
        <pre id="jobLog">选择任务后查看运行日志</pre>
        <div id="outputs" class="outputs"></div>
      </aside>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
