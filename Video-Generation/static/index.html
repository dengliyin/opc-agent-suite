<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>片段产出智能体入口</title>
    <link rel="stylesheet" href="/styles.css?v=tkfastmoss-ui-2" />
  </head>
  <body>
    <div class="portal-shell">
      <header class="portal-header">
        <div>
          <h1>片段产出智能体</h1>
          <p class="muted">选择要进入的片段产出工作台</p>
        </div>
        <div class="toolbar">
          <a class="button secondary nav-link" href="/settings">路径设置</a>
          <a class="button secondary nav-link" href="/api-settings">API 设置</a>
        </div>
      </header>

      <main class="portal-grid">
        <a class="portal-option available" href="/omni">
          <span class="portal-option-title">Omni 片段产出</span>
          <span class="portal-option-meta">人物图、故事版图、Omni 视频</span>
        </a>
        <a class="portal-option available" href="/grok">
          <span class="portal-option-title">Grok 片段产出</span>
          <span class="portal-option-meta">人物图、故事版图、Grok 视频</span>
        </a>
        <a class="portal-option available" href="/hybrid-omni">
          <span class="portal-option-title">混剪钩子与 CTA Omni 片段产出</span>
          <span class="portal-option-meta">读取混剪适配脚本，生成独立的钩子与 CTA 片段</span>
        </a>
        <a class="portal-option available" href="/assembly">
          <span class="portal-option-title">片段合成</span>
          <span class="portal-option-meta">扫描已归档片段，合成成品视频并清理中间素材</span>
        </a>
      </main>
    </div>
  </body>
</html>
