<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>混剪钩子与 CTA Omni 片段产出</title>
    <link rel="stylesheet" href="/styles.css?v=workspace-layout-20260828" />
    <link rel="stylesheet" href="/opc-theme.css?v=20260828-contrast1" />
  </head>
  <body class="opc-agent">
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>混剪钩子与 CTA Omni 片段产出</h1>
          <div id="configLine" class="config-line"></div>
          <div id="globalAgentStatus" class="global-agent-status"></div>
        </div>
        <div class="toolbar">
          <a class="button secondary nav-link opc-home-link" href="http://127.0.0.1:8888/">控制台</a>
          <a class="button secondary nav-link" href="/">入口</a>
          <label class="toggle">
            <input id="overwriteToggle" type="checkbox" />
            <span>强制重跑</span>
          </label>
          <label class="toggle concurrency-toggle">
            <span>脚本并发</span>
            <select id="concurrencySelect" aria-label="脚本并发数"></select>
          </label>
          <button id="refreshButton" class="button secondary" type="button">增量扫描</button>
          <button id="fullRefreshButton" class="button secondary" type="button">强制完整校验</button>
          <button id="cancelButton" class="button danger" type="button" disabled>停止任务</button>
          <button data-stage="characters" class="button secondary run-button" type="button">功能1 生成人物图</button>
          <button data-stage="storyboards" class="button secondary run-button" type="button">功能2 生成故事版图</button>
          <button data-stage="videos" class="button secondary run-button" type="button" title="输入：故事板仅作导演参考（不进入成片）+ 当前片段完整脚本">功能3 故事版图 → 视频</button>
          <button data-stage="direct_videos" class="button secondary run-button" type="button" title="输入：人物图 + 产品参考图 + ### 镜头后的脚本">功能4 人物图+产品图 → 视频</button>
          <button data-stage="product_videos" class="button secondary run-button" type="button" title="输入：产品参考图 + ### 镜头后的脚本；不需要人物图和故事版图">功能5 产品图+镜头脚本 → 视频</button>
          <button data-stage="smart" class="button primary run-button" type="button" title="一键按顺序执行功能1、功能2、功能3；最终视频仍由功能3生成">功能6 一键完整流程（1→2→3）</button>
        </div>
      </header>

      <main class="workspace">
        <section class="panel product-panel">
          <div class="panel-heading">
            <h2>混剪脚本（钩子 / CTA）</h2>
            <div class="heading-actions">
              <span id="summaryLine" class="muted"></span>
              <button id="selectCompletedScriptsButton" class="mini-button" type="button">选有视频</button>
              <button id="exportSelectedButton" class="mini-button primary-mini" type="button">导出已选</button>
              <button id="restoreSelectedButton" class="mini-button primary-mini" type="button" hidden>恢复生成</button>
              <button id="archiveToggleButton" class="mini-button" type="button">查看归档</button>
              <button id="selectAllScriptsButton" class="mini-button" type="button">全选</button>
              <button id="clearScriptSelectionButton" class="mini-button" type="button">清空</button>
              <button id="deleteSelectedScriptsButton" class="mini-button danger-mini" type="button">删除所选</button>
            </div>
          </div>
          <div id="scriptList" class="script-list"></div>
        </section>

        <section class="panel segment-panel">
          <div class="panel-heading">
            <h2 id="selectedTitle">片段状态</h2>
            <span id="selectedMeta" class="muted"></span>
          </div>
          <div id="segmentTable" class="segment-table"></div>
        </section>

        <aside class="side-column">
          <section class="panel">
            <div class="panel-heading">
              <h2>任务日志</h2>
              <span id="jobState" class="muted"></span>
            </div>
            <div id="jobProgress" class="progress"><span></span></div>
            <div id="jobLogs" class="log-list"></div>
          </section>
        </aside>
      </main>
    </div>
    <script>window.AGENT_API_BASE = "/hybrid-omni/api";</script>
    <script src="/app.js?v=country-groups-18"></script>
  </body>
</html>
